[project]
name = "dreamcache"
version = "0.1.0"
description = "Selective speculative execution for LLM agents in MiniGrid"
requires-python = ">=3.11"
dependencies = [
  "minigrid==3.0.0",
  "gymnasium>=1.0",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "mcts==1.0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running", "ollama: needs a live Ollama server"]
addopts = "-m 'not ollama'"
