[project]
name = "cortex"
version = "0.1.0"
description = "Cortex: agentic robot-learning studio on LeRobot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10",
  "python-multipart>=0.0.9",
  "lerobot[dataset,training,feetech]==0.6.1",
  "mujoco>=3.3.7",
  "gymnasium>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E731", "B008", "B023", "E501", "B905"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex"]
