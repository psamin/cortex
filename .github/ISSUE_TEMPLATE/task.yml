name: Task
description: A unit of work. Every change starts with one of these.
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences on what this task accomplishes.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files touched
      description: >
        Every file you will create, modify or delete, using exact paths,
        each tagged [new] / [mod] / [del]. Before claiming, check that no
        open issue lists the same files (see CONTRIBUTING.md §1).
      placeholder: |
        [new] src/dreamcache/environments/cloning.py
        [new] tests/environments/test_cloning.py
        [mod] src/dreamcache/environments/__init__.py
    validations:
      required: true
  - type: textarea
    id: interfaces
    attributes:
      label: Interfaces
      description: Public functions, classes, config keys, or file formats you add or change. Write "none" if there are none.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check someone else can run.
      placeholder: "`uv run pytest tests/environments` passes; clone-independence test included."
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Depends on / blocks
      placeholder: "depends on #3; blocks #7"
  - type: input
    id: driver
    attributes:
      label: Driver
      description: Who is doing it. For agents, include the human driving them.
      placeholder: "@alice (Claude Code agent)"
    validations:
      required: true
