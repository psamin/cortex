# DoorKey-8x8 held-out test (seeds 10000-10099), 60-step cap as in val. Part A.
split: test
n_seeds: 100
max_steps: 60
envs: [MiniGrid-DoorKey-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", big_model: "qwen3:8b", prompt: v3}
defaults:
  detector: {alpha: 0.4, beta: 0.3, gamma: 0.3, n_proposals: 3}
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {name: A_greedy, agent: {trigger: never}}
  - {name: L_greedy_8b, fast: {model: "qwen3:8b"}, agent: {trigger: never}}
  - {name: B_always, agent: {trigger: always, spec: {samples: 2}}}
  - {name: C_risk_only_0.4, agent: {trigger: threshold, threshold: 0.4, detector: {alpha: 0, beta: 0, gamma: 1}, spec: {samples: 2}}}
  - {name: I_planner_sim, kind: planner_sim}
  - {name: I_planner_obs, kind: planner_obs}
