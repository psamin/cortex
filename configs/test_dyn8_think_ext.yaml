# Baseline H (extra model reasoning instead of environment rollouts), held-out test seeds.
# qwen3:4b with thinking enabled (num_predict 1024), no rollouts. Compare with A_greedy /
# B_always / C_risk_only_0.4 from the main test run (same seeds). Capped at 60 steps
# (main-test greedy averages 22 steps, always-on 18); capped episodes count as non-success.
split: test
seed_range: [10032, 10100]   # extension to 100 test seeds
max_steps: 60   # thinking calls take ~26 s at 32-way concurrency; uncapped episodes ran to 256 steps
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", prompt: v3}
methods:
  - {name: H_think_4b, fast: {think: true}, agent: {trigger: never}}
