# Phase 3: tuning on VALIDATION seeds 1000-1049 (thresholds, trigger budget).
split: val
n_seeds: 50
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", big_model: "qwen3:8b", prompt: v3}
defaults:
  detector: {alpha: 0.4, beta: 0.3, gamma: 0.3, n_proposals: 3}
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {agent: {trigger: never}, name: A_greedy}
  - {agent: {trigger: never}, fast: {model: 'qwen3:8b'}, name: L_greedy_8b}
  - {agent: {resolve: verify, trigger: always}, name: J_verify_always}
  - {agent: {resolve: verify, threshold: 0.4, trigger: threshold}, name: J_verify_sel_0.4}
  - {agent: {resolve: cascade, threshold: 0.4, trigger: threshold}, name: O_cascade_sel_0.4}
  - {agent: {mode: spec_draft, plan_len: 4}, name: K_specdraft_L4}
  - {agent: {resolve: vote, threshold: 0.4, trigger: threshold, vote_n: 5}, name: M_vote5_sel_0.4}
  - {agent: {mcts_depth: 8, mcts_iterations: 60, resolve: mcts, trigger: always}, name: N_mcts_always}
  - {agent: {mcts_depth: 8, mcts_iterations: 60, resolve: mcts, threshold: 0.4, trigger: threshold}, name: N_mcts_sel_0.4}
