# Inference-speedup experiment (validation seeds). Response cache DISABLED for every
# method so wall-clock latency is real; identical worker count for all methods.
# Run with DC_WORKERS=4. Compare against L_greedy_8b (same actor model, no speculation).
split: val
n_seeds: 20
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", big_model: "qwen3:8b", prompt: v3, cache: false}
defaults:
  detector: {alpha: 0.4, beta: 0.3, gamma: 0.3, n_proposals: 3}
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {name: A_greedy_4b, agent: {trigger: never}}
  - {name: L_greedy_8b, fast: {model: "qwen3:8b"}, agent: {trigger: never}}
  - {name: LS_lossless_heur, kind: lossless, guessers: [obs_heuristic]}
  - {name: LS_lossless_small, kind: lossless, guessers: [small_llm]}
  - {name: LS_lossless_both, kind: lossless, guessers: [obs_heuristic, small_llm]}
  - {name: K_specdraft_L4, agent: {mode: spec_draft, plan_len: 4}}
  - {name: J_verify_sel_0.4, agent: {trigger: threshold, threshold: 0.4, resolve: verify}}
  - {name: C_sel_0.4, agent: {trigger: threshold, threshold: 0.4}}
  - {name: B_always, agent: {trigger: always}}
