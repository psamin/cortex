# Experiment 2: corrected B8. The first B8 used a predictor with no rows for the SSD workflow
# (sbatch --export comma-splitting dropped them), i.e. a cold-start predictor trained on the
# 8b actor. Here the predictor is trained on val trajectories of the SSD agent itself.
# B1 is re-run in the same job so both share identical contention.
split: test
n_seeds: 20
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", big_model: "qwen3:8b", prompt: v3, cache: false}
defaults:
  detector: {alpha: 0.4, beta: 0.3, gamma: 0.3, n_proposals: 3}
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {name: B1_ssd_sel_0.4, agent: {trigger: threshold, threshold: 0.4}}
  - {name: B8_ssd_plus_prefetch_fixed, agent: {trigger: threshold, threshold: 0.4}, prefetch: {predictor: personalized, rows: results/specgraph_ssd/rows_train.jsonl, workflow: ssd4b, sched: {policy: top1}}}
