# Experiment 2 B7: original SSD vs SSD with rollout candidates ranked by the execution-graph
# predictor (learned from the SSD agent's own val trajectories). K=2 so ranking matters
# (3 legal actions). Cache off, test seeds. Pair-only rerun (B1-K2 vs B7) on its own GPU.
split: test
seed_range: [10050, 10100]   # extension of B7 vs B1-K2 to 100 test seeds
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", prompt: v3, cache: false}
defaults:
  detector: {alpha: 0.4, beta: 0.3, gamma: 0.3, n_proposals: 3}
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {name: B1_ssd_K2_llm_ranked, agent: {trigger: threshold, threshold: 0.4, spec: {k: 2}}}
  - {name: B7_ssd_K2_graph_ranked, agent: {trigger: threshold, threshold: 0.4, spec: {k: 2, candidates: graph}}, graph_rank: {predictor: personalized, rows: results/specgraph_ssd/rows_train.jsonl, workflow: ssd4b}}
