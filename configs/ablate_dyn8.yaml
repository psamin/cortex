# Ablations 2,3,6,7 + evaluator/samples. Validation seeds (first 20). Always-on speculation
# isolates the speculative executor from the trigger.
split: val
n_seeds: 20
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", prompt: v3}
defaults:
  detector: {n_proposals: 3}
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {name: K1, agent: {trigger: always, spec: {k: 1}}}
  - {name: K2, agent: {trigger: always, spec: {k: 2}}}
  - {name: K3, agent: {trigger: always, spec: {k: 3}}}
  - {name: H1, agent: {trigger: always, spec: {horizon: 1}}}
  - {name: H3, agent: {trigger: always, spec: {horizon: 3}}}
  - {name: H10, agent: {trigger: always, spec: {horizon: 10}}}
  - {name: H20, agent: {trigger: always, spec: {horizon: 20}}}
  - {name: roll_random, agent: {trigger: always, spec: {rollout_policy: random}}}
  - {name: roll_obs_bfs, agent: {trigger: always, spec: {rollout_policy: obs_bfs}}}
  - {name: eval_env, agent: {trigger: always, evaluator: {kind: env}}}
  - {name: samples1, agent: {trigger: always, spec: {samples: 1}}}
  - {name: parallel4, agent: {trigger: always, spec: {parallel: 4}}}
  - {name: cand_uniform, agent: {trigger: always, spec: {candidates: uniform}}}
  - {name: cand_llm_sample, agent: {trigger: always, spec: {candidates: llm_sample}}}
