# Inference-speedup test WITH DEDICATED SPECULATION CAPACITY: real (critical-path) actor calls
# go to this job's own GPU; every speculative call (prefetches, guesser calls, drafted-state
# verifications) goes to a second Ollama server on another GPU of the same node (a separate
# single-GPU job). Same models, same Ollama version, cache off, 2 workers, val seeds as the
# single-GPU run (latency_single_h200) for direct comparison.
split: val
n_seeds: 12
envs: [MiniGrid-Dynamic-Obstacles-8x8-v0]
fast: {kind: llm, model: "qwen3:4b", big_model: "qwen3:8b", prompt: v3, cache: false, spec_host: "http://127.0.0.1:31234"}
defaults:
  spec: {k: 3, horizon: 5, samples: 4, rollout_policy: sim_bfs, candidates: llm_rank}
  evaluator: {kind: shaped}
methods:
  - {name: L_greedy_8b, fast: {model: "qwen3:8b"}, agent: {trigger: never}}
  - {name: LS_lossless_heur, kind: lossless, guessers: [obs_heuristic]}
  - {name: LS_lossless_small, kind: lossless, guessers: [small_llm]}
  - {name: LS_lossless_both, kind: lossless, guessers: [obs_heuristic, small_llm]}
  - {name: K2_lossless_draft_L2, agent: {mode: spec_draft_lossless, plan_len: 2}}
  - {name: K2_lossless_draft_L4, agent: {mode: spec_draft_lossless, plan_len: 4}}
  - {name: B5_learned_top1_prefetch_8b, fast: {model: "qwen3:8b"}, agent: {trigger: never}, prefetch: {predictor: personalized, rows: results/specgraph/rows_train.jsonl, workflow: actor8b, sched: {policy: top1}}}
  - {name: TopK3_prefetch_8b, fast: {model: "qwen3:8b"}, agent: {trigger: never}, prefetch: {predictor: personalized, rows: results/specgraph/rows_train.jsonl, workflow: actor8b, sched: {policy: topk, k: 3, max_inflight: 3, budget_ratio: 3.0}}}
